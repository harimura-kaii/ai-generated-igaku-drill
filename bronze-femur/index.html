<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>腐食青銅大腿骨 — 360°インタラクティブビューア</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d12; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 読み込みオーバーレイ */
  #loader {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0a0d12; color: #cfe0d6; font-family: system-ui, "Segoe UI", sans-serif;
    z-index: 30; transition: opacity .5s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #bar { width: 240px; height: 6px; background: #1c242e; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#4fae7a,#8fd6a8); transition: width .2s; }
  #err { color: #ff9b9b; max-width: 80%; text-align: center; font-size: 14px; line-height: 1.6; }

  /* 操作説明パネル */
  #help {
    position: absolute; top: 16px; left: 16px; z-index: 20;
    background: rgba(14,20,27,.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(120,160,140,.22); border-radius: 12px;
    padding: 14px 16px; color: #d6e4dc;
    font-family: system-ui, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.85;
    max-width: 260px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #help h1 { font-size: 14px; margin-bottom: 8px; color: #9fe0b8; letter-spacing: .02em; }
  #help .k {
    display: inline-block; min-width: 74px; color: #7fd6a2; font-weight: 600;
  }
  #help .muted { color: #8ba69a; font-size: 12px; margin-top: 8px; }
  #help.collapsed .body { display: none; }
  #help .toggle {
    position: absolute; top: 10px; right: 12px; cursor: pointer;
    color: #7fd6a2; font-size: 12px; user-select: none;
  }

  /* ボタン列 */
  #ui {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  #ui button {
    background: rgba(20,28,36,.82); color: #d6e4dc;
    border: 1px solid rgba(120,160,140,.28); border-radius: 10px;
    padding: 9px 16px; font-size: 13px; cursor: pointer;
    font-family: system-ui, "Segoe UI", sans-serif; transition: background .15s, border-color .15s;
  }
  #ui button:hover { background: rgba(40,60,50,.9); border-color: #6fc697; }
  #ui button:active { transform: translateY(1px); }

  #hint {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #5f7568; font-size: 11px; font-family: system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div style="font-family:system-ui,sans-serif;font-size:15px;color:#9fe0b8;">腐食青銅大腿骨を読み込み中…</div>
  <div id="bar"><div></div></div>
  <div id="err"></div>
</div>

<div id="help">
  <span class="toggle" id="helpToggle">［隠す］</span>
  <h1>操作方法</h1>
  <div class="body">
    <div><span class="k">ドラッグ</span>回転（左右・上下）</div>
    <div><span class="k">ホイール</span>ズーム</div>
    <div><span class="k">右ドラッグ</span>平行移動（パン）</div>
    <div><span class="k">スマホ</span>1本指で回転／2本指でズーム・パン</div>
    <div><span class="k">Rキー</span>視点リセット</div>
    <div><span class="k">Fキー</span>全画面</div>
    <div class="muted">上下回転は真上から真下まで一周見られます。</div>
  </div>
</div>

<div id="ui">
  <button id="btnReset" title="視点を初期位置に戻す">リセット</button>
  <button id="btnTop" title="真上から見る">真上</button>
  <button id="btnBottom" title="真下から見る">真下</button>
  <button id="btnSpin" title="自動回転のオン/オフ">自動回転</button>
  <button id="btnFull" title="全画面表示">全画面</button>
</div>
<div id="hint">ドラッグで回転 / ホイールでズーム / 右ドラッグでパン</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

// Mobile networks and memory are more constrained, so use the smaller LOD1
// on phones/tablets. Desktop keeps the full-detail LOD0 appearance.
const isMobile = window.matchMedia('(max-width: 700px)').matches ||
  (navigator.connection && (navigator.connection.saveData || /2g|3g/.test(navigator.connection.effectiveType || '')));
const MODEL_URL = isMobile
  ? './ancient_bronze_femur_LOD1.glb'
  : './ancient_bronze_femur_LOD0.glb';
const app = document.getElementById('app');
const loaderEl = document.getElementById('loader');
const barEl = document.querySelector('#bar > div');
const errEl = document.getElementById('err');

// ---- レンダラ ----
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

// ---- シーン（暗色背景 + 微グラデ）----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);

// 環境光（IBL）で金属の質感を出す
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---- カメラ ----
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 100);

// ---- ライト（見やすい三点照明）----
const key = new THREE.DirectionalLight(0xfff4e0, 2.4);
key.position.set(1.2, 1.6, 1.0);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd4ff, 1.0);
fill.position.set(-1.4, 0.4, 0.6);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.6);
rim.position.set(-0.6, 0.8, -1.4);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x404a55, 0.6));

// ---- コントロール ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.9;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.8;
controls.screenSpacePanning = true;
// 上下回転を真上(0)から真下(π)まで許可
controls.minPolarAngle = 0.0;
controls.maxPolarAngle = Math.PI;
controls.autoRotateSpeed = 1.4;

// ---- モデル読み込み ----
let homeState = null;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;

    // テクスチャの色空間を正しく設定（埋め込みPNGのbaseColorをsRGBに）
    model.traverse((o) => {
      if (o.isMesh && o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
          m.needsUpdate = true;
        }
        o.castShadow = false; o.receiveShadow = false;
      }
    });

    // 中心合わせ & 接地
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center); // 原点中心に
    scene.add(model);

    // カメラを対象に合わせてフレーミング
    const radius = size.length() * 0.5;
    const fov = camera.fov * Math.PI / 180;
    const dist = radius / Math.sin(fov / 2) * 1.15;

    controls.target.set(0, 0, 0);
    camera.position.set(dist * 0.55, dist * 0.35, dist * 0.85);
    camera.near = radius / 100;
    camera.far = radius * 100;
    camera.updateProjectionMatrix();

    controls.minDistance = radius * 0.6;
    controls.maxDistance = radius * 8;
    controls.update();

    // ホーム状態を保存
    homeState = {
      pos: camera.position.clone(),
      target: controls.target.clone(),
      dist,
      radius,
    };

    // 読み込み完了
    loaderEl.classList.add('hidden');
    setTimeout(() => loaderEl.remove(), 600);
  },
  (ev) => {
    if (ev.total) {
      const pct = Math.min(100, (ev.loaded / ev.total) * 100);
      barEl.style.width = pct.toFixed(0) + '%';
    } else {
      barEl.style.width = '60%';
    }
  },
  (err) => {
    console.error(err);
    barEl.parentElement.style.display = 'none';
    errEl.innerHTML =
      'モデルの読み込みに失敗しました。<br>' +
      'file:// で直接開いた場合、ブラウザのセキュリティ制限により<br>' +
      'GLBを読み込めないことがあります。<br><br>' +
      '同梱の <b>start_viewer.bat</b> を実行して<br>ローカルサーバー経由で開いてください。';
  }
);

// ---- 視点操作ヘルパ ----
function goHome() {
  if (!homeState) return;
  camera.position.copy(homeState.pos);
  controls.target.copy(homeState.target);
  controls.update();
}
function viewFrom(dir) {
  if (!homeState) return;
  const d = homeState.dist;
  controls.target.set(0, 0, 0);
  // 真上/真下は少しだけ横にずらして骨の輪郭が潰れないようにする
  if (dir === 'top') camera.position.set(0.0001, d, 0.0001);
  else camera.position.set(0.0001, -d, 0.0001);
  controls.update();
}

// ---- UI ----
document.getElementById('btnReset').onclick = goHome;
document.getElementById('btnTop').onclick = () => viewFrom('top');
document.getElementById('btnBottom').onclick = () => viewFrom('bottom');
document.getElementById('btnSpin').onclick = () => {
  controls.autoRotate = !controls.autoRotate;
};
document.getElementById('btnFull').onclick = toggleFullscreen;

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

const helpEl = document.getElementById('help');
document.getElementById('helpToggle').onclick = () => {
  helpEl.classList.toggle('collapsed');
  document.getElementById('helpToggle').textContent =
    helpEl.classList.contains('collapsed') ? '［操作説明］' : '［隠す］';
};

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') goHome();
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

// ---- リサイズ ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- ループ ----
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
